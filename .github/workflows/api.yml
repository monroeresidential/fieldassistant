name: api

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fa
          POSTGRES_PASSWORD: fa
          POSTGRES_DB: fieldassistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fa:fa@localhost:5432/fieldassistant_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Generate code
        run: make generate
      - name: Fail if generated code is stale
        run: git diff --exit-code -- api/internal
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Test
        working-directory: api
        run: go test ./...
