openapi: 3.0.3
info:
  title: Field Assistant API
  version: 1.7.0
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /auth/start:
    post:
      operationId: authStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthStartRequest'
      responses:
        '200':
          description: Authorization URL to open in the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStartResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/callback:
    get:
      operationId: authCallback
      security: []
      description: >-
        Procore redirects here after the user consents or declines. The
        response is always a 302 back to the app: `Location` is either
        `<app scheme>://auth?code=<one-time code>` on success or
        `<app scheme>://auth?error=<code>` on failure, where `<app scheme>`
        is `fieldassistant` in production and `fieldassistant-dev` in the dev
        environment, and `<code>` is
        one of `access_denied` (the user declined in Procore), `bad_request`
        (missing code, or unknown or expired state), `procore_unavailable`
        (the Procore token exchange or user lookup failed) or `internal`.
      parameters:
        - name: code
          in: query
          required: false
          description: Procore authorization code. Absent when Procore reports an error.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Procore OAuth error, such as `access_denied` when the user declines consent.
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: >-
            Redirect to the app with either a one-time `code` or an `error`
            query parameter (see the operation description).
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/exchange:
    post:
      operationId: authExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthExchangeRequest'
      responses:
        '200':
          description: Session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: authLogout
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /me/selection:
    put:
      operationId: putMeSelection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Selection'
      responses:
        '204':
          description: Selection saved.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /companies:
    get:
      operationId: listCompanies
      responses:
        '200':
          description: Companies the user can access.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /companies/{companyId}/projects:
    get:
      operationId: listProjects
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Projects in the company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/lookups/{kind}:
    get:
      operationId: getLookup
      description: >-
        One of the project's lookup lists, served from the backend cache.
        Send the last `ETag` in `If-None-Match` to get a 304 when nothing
        changed, and `Cache-Control: no-cache` to force a refresh from
        Procore. A kind the user may not read in Procore answers 200 with
        `unavailable: true`, no rows and the reason.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [users, locations, spec_sections, cost_codes, vendors, drawings]
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: Cache-Control
          in: header
          required: false
          description: '`no-cache` refetches the list from Procore.'
          schema:
            type: string
      responses:
        '200':
          description: The lookup list.
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '304':
          description: The list matches If-None-Match.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/features:
    get:
      operationId: getProjectFeatures
      description: >-
        Which features the signed-in user may use on the project, so the app
        can say so before anything is recorded. A feature Procore will refuse
        (a Read-only user on the RFI tool, or the tool turned off) is listed
        with `available: false` and Procore's reason. Answers are cached per
        user and project for ten minutes; `Cache-Control: no-cache` asks
        Procore again, and a sync of the project drops the cached answer.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: Cache-Control
          in: header
          required: false
          description: '`no-cache` asks Procore again.'
          schema:
            type: string
      responses:
        '200':
          description: The user's features on the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturesResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/records/{kind}:
    get:
      operationId: getRecords
      description: >-
        A page of the project's records of one kind as the signed-in user may
        see them in Procore, changed since the cursor. The backend pulls from
        Procore first when its copy is older than 60 seconds; Cache-Control:
        no-cache forces the pull. The first call sends since=0.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [rfi]
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: since
          in: query
          required: false
          description: Cursor from the previous page's `next_since`; 0 for the first call.
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 500
            minimum: 1
            maximum: 500
        - name: Cache-Control
          in: header
          required: false
          description: '`no-cache` forces a pull from Procore before answering.'
          schema:
            type: string
      responses:
        '200':
          description: The page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/sync:
    post:
      operationId: syncProject
      description: >-
        Pulls the requested kinds from Procore now, as the signed-in user, and
        reports the outcome of each pull. `full` re-pulls everything instead of
        only what changed.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: The outcome of each pull.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/records/rfi/{rfiId}/attachments/{attachmentId}:
    get:
      operationId: getRFIAttachment
      description: >-
        An RFI attachment streamed through the backend, so the phone never
        sees Procore's expiring URL.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: rfiId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The attachment bytes.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
            Content-Type:
              required: true
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /drafts:
    post:
      operationId: createDraft
      description: >-
        Creates a draft from a transcript and runs extraction. The client
        chooses the draft id; repeating the call with the same id returns the
        existing draft, so the response is 200 rather than 201.
      parameters:
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listDrafts
      parameters:
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: project_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: The user's drafts in the project, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /drafts/{draftId}:
    get:
      operationId: getDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: saveDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: The saved draft, revalidated against the lookups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /drafts/{draftId}/submit:
    post:
      operationId: submitDraft
      description: >-
        Queues the draft for submission to Procore. `Idempotency-Key` must be
        the draft id. A draft that is already submitted answers 200; a newly
        queued or in-flight submit answers 202 with the job to poll. A 400
        means the draft still has unresolved fields, a photo has not finished
        uploading, or the key does not match.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The draft was already submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '202':
          description: The submit is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /drafts/{draftId}/attachments/{attachmentId}:
    put:
      operationId: putDraftAttachment
      description: >-
        Uploads the JPEG bytes of a photo listed in the draft's manifest. The
        body must be a JPEG of at most 20 MiB. Repeating the call for a photo
        already stored returns it unchanged. A draft that is submitting or
        submitted answers 400.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The stored photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteDraftAttachment
      description: >-
        Removes a photo from the draft. A draft that is submitting or
        submitted answers 400.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The photo was removed.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The job's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    AuthStartRequest:
      type: object
      required: [device_id, code_challenge]
      properties:
        device_id:
          type: string
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
          description: Base64url without padding of the SHA-256 of a client-generated code_verifier.
    AuthStartResponse:
      type: object
      required: [authorize_url, state]
      properties:
        authorize_url:
          type: string
          format: uri
        state:
          type: string
    AuthExchangeRequest:
      type: object
      required: [code, device_id, code_verifier]
      properties:
        code:
          type: string
        device_id:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: The secret whose SHA-256 was sent as code_challenge to /auth/start.
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    User:
      type: object
      required: [id, procore_user_id, email, name, reauth_required]
      properties:
        id:
          type: string
          format: uuid
        procore_user_id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        reauth_required:
          type: boolean
        last_company_id:
          type: integer
          format: int64
        last_project_id:
          type: integer
          format: int64
    Selection:
      type: object
      required: [company_id, project_id]
      properties:
        company_id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Project:
      type: object
      required: [id, name, display_name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        display_name:
          type: string
    LookupRow:
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        extra:
          type: object
          additionalProperties:
            type: string
    LookupResponse:
      type: object
      required: [kind, rows, unavailable, fetched_at]
      properties:
        kind:
          type: string
          enum: [users, locations, spec_sections, cost_codes, vendors, drawings]
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LookupRow'
        unavailable:
          type: boolean
        reason:
          type: string
        fetched_at:
          type: string
          format: date-time
    FeatureState:
      type: object
      required: [feature, available]
      properties:
        feature:
          type: string
          enum: [rfi]
        available:
          type: boolean
        reason:
          type: string
          description: Why the feature is unavailable, in Procore's words when Procore gave any. Absent when available.
    FeaturesResponse:
      type: object
      required: [features, fetched_at]
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureState'
        fetched_at:
          type: string
          format: date-time
    PullStatus:
      type: object
      required: [kind, status]
      properties:
        kind:
          type: string
        status:
          type: string
          enum: [fresh, pulled, failed]
        pulled_at:
          type: string
          format: date-time
        code:
          type: string
        message:
          type: string
    RecordPage:
      type: object
      required: [records, deleted_ids, next_since, has_more, pull]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordEnvelope'
        deleted_ids:
          type: array
          items:
            type: integer
            format: int64
        next_since:
          type: integer
          format: int64
        has_more:
          type: boolean
        synced_at:
          type: string
          format: date-time
        pull:
          $ref: '#/components/schemas/PullStatus'
    RecordEnvelope:
      type: object
      required: [id, kind, updated_at, change_seq]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        updated_at:
          type: string
          format: date-time
        change_seq:
          type: integer
          format: int64
        rfi:
          $ref: '#/components/schemas/RFIRecord'
    SyncRequest:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          minItems: 1
          items:
            type: string
            enum: [rfi]
        full:
          type: boolean
          default: false
    SyncResult:
      type: object
      required: [pulls]
      properties:
        pulls:
          type: array
          items:
            $ref: '#/components/schemas/PullStatus'
    Ref:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ImpactRef:
      type: object
      description: Procore cost_impact or schedule_impact.
      properties:
        status:
          type: string
        value:
          type: string
    RFIAttachment:
      type: object
      required: [id, name, url]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        filename:
          type: string
        url:
          type: string
          description: The app's proxy path for the bytes, never Procore's expiring URL.
    RFIAnswer:
      type: object
      required: [id, plain_text_body, attachments]
      properties:
        id:
          type: integer
          format: int64
        answer_date:
          type: string
          format: date-time
        plain_text_body:
          type: string
        rich_text_body:
          type: string
        created_by:
          $ref: '#/components/schemas/Ref'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/RFIAttachment'
    RFIQuestion:
      type: object
      required: [id, plain_text_body, attachments, answers]
      properties:
        id:
          type: integer
          format: int64
        question_date:
          type: string
          format: date-time
        plain_text_body:
          type: string
        rich_text_body:
          type: string
        created_by:
          $ref: '#/components/schemas/Ref'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/RFIAttachment'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/RFIAnswer'
    RFIRecord:
      type: object
      required: [id, number, subject, status, draft, private, created_at, updated_at, assignees, ball_in_courts, distribution_list, drawing_ids, current_revision, has_revisions, questions]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        full_number:
          type: string
        prefix:
          type: string
        subject:
          type: string
        status:
          type: string
        translated_status:
          type: string
        draft:
          type: boolean
        private:
          type: boolean
        due_date:
          type: string
          format: date
        initiated_at:
          type: string
          format: date-time
        time_resolved:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/Ref'
        assignee:
          $ref: '#/components/schemas/Ref'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
        ball_in_court:
          $ref: '#/components/schemas/Ref'
        ball_in_courts:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
        ball_in_court_role:
          type: string
        rfi_manager:
          $ref: '#/components/schemas/Ref'
        received_from:
          $ref: '#/components/schemas/Ref'
        responsible_contractor:
          $ref: '#/components/schemas/Ref'
        distribution_list:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
        location:
          $ref: '#/components/schemas/Ref'
        specification_section:
          $ref: '#/components/schemas/Ref'
        cost_code:
          $ref: '#/components/schemas/Ref'
        cost_impact:
          $ref: '#/components/schemas/ImpactRef'
        schedule_impact:
          $ref: '#/components/schemas/ImpactRef'
        drawing_number:
          type: string
        drawing_ids:
          type: array
          items:
            type: integer
            format: int64
        reference:
          type: string
        revision:
          type: string
        current_revision:
          type: boolean
        has_revisions:
          type: boolean
        questions:
          type: array
          items:
            $ref: '#/components/schemas/RFIQuestion'
        custom_fields:
          type: object
          additionalProperties: true
        link:
          type: string
    CreateDraftRequest:
      type: object
      required: [id, feature, project_id, transcript, captured_at]
      properties:
        id:
          type: string
          format: uuid
        feature:
          type: string
          enum: [rfi]
        project_id:
          type: integer
          format: int64
        transcript:
          type: string
          minLength: 1
        captured_at:
          type: string
          format: date-time
        location:
          type: object
          required: [lat, lng]
          properties:
            lat:
              type: number
              format: double
            lng:
              type: number
              format: double
        attachments:
          type: array
          description: >-
            The photos the client will upload with putDraftAttachment, in
            order. Each starts pending.
          maxItems: 10
          items:
            $ref: '#/components/schemas/AttachmentManifestItem'
    AttachmentManifestItem:
      type: object
      required: [id, filename, content_type, bytes]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum: [image/jpeg]
        bytes:
          type: integer
          format: int64
          minimum: 1
    Attachment:
      type: object
      required: [id, filename, bytes, state]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        bytes:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, stored, uploaded, failed]
          description: >-
            pending until the bytes are uploaded, stored once they are,
            uploaded once sent to Procore, failed when Procore could not take
            them (see error).
        procore_upload_id:
          type: string
        error:
          $ref: '#/components/schemas/Error'
    Impact:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [yes_known, yes_unknown, 'no', tbd]
        value:
          type: string
    RFIDraftPayload:
      type: object
      required: [assignee_ids, distribution_ids, private, draft]
      properties:
        subject:
          type: string
        question_body:
          type: string
        assignee_ids:
          type: array
          items:
            type: integer
            format: int64
        rfi_manager_id:
          type: integer
          format: int64
        distribution_ids:
          type: array
          items:
            type: integer
            format: int64
        responsible_contractor_id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
        specification_section_id:
          type: integer
          format: int64
        drawing_number:
          type: string
        cost_code_id:
          type: integer
          format: int64
        due_date:
          type: string
          format: date
        schedule_impact:
          $ref: '#/components/schemas/Impact'
        cost_impact:
          $ref: '#/components/schemas/Impact'
        private:
          type: boolean
        draft:
          type: boolean
    UnresolvedField:
      type: object
      required: [field, reason, candidates, blocking]
      properties:
        field:
          type: string
        reason:
          type: string
          enum: [ambiguous, not_found, not_in_lookup, date_unparseable, procore_validation, invalid_value]
        message:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/LookupRow'
        blocking:
          type: boolean
          description: >-
            True when submit refuses until this field is settled: the field is
            required to create the record, or its value is wrong
            (not_in_lookup, invalid_value, procore_validation). False for an
            advisory flag (not_found, ambiguous, date_unparseable on an
            optional field), which is shown but does not block submit.
    DraftResult:
      type: object
      required: [procore_id]
      properties:
        procore_id:
          type: integer
          format: int64
        number:
          type: string
        url:
          type: string
    DraftResponse:
      type: object
      required: [id, feature, project_id, status, payload, unresolved, confidence, transcript, attachments, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        feature:
          type: string
          enum: [rfi]
        project_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [extracted, reviewed, submitting, submitted, failed]
        payload:
          $ref: '#/components/schemas/RFIDraftPayload'
        unresolved:
          type: array
          items:
            $ref: '#/components/schemas/UnresolvedField'
        confidence:
          type: object
          additionalProperties:
            type: number
            format: double
        transcript:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        model_version:
          type: string
        result:
          $ref: '#/components/schemas/DraftResult'
        error:
          $ref: '#/components/schemas/Error'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SaveDraftRequest:
      type: object
      required: [payload]
      properties:
        payload:
          $ref: '#/components/schemas/RFIDraftPayload'
    SubmitResponse:
      type: object
      required: [job_id, draft_id, status]
      properties:
        job_id:
          type: string
        draft_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [submitting, submitted]
    JobStatus:
      type: object
      required: [id, draft_id, status]
      properties:
        id:
          type: string
        draft_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result:
          $ref: '#/components/schemas/DraftResult'
        error:
          $ref: '#/components/schemas/Error'
