openapi: 3.0.3
info:
  title: Field Assistant API
  version: 1.2.0
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /auth/start:
    post:
      operationId: authStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthStartRequest'
      responses:
        '200':
          description: Authorization URL to open in the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStartResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/callback:
    get:
      operationId: authCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the app with a one-time code.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/exchange:
    post:
      operationId: authExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthExchangeRequest'
      responses:
        '200':
          description: Session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: authLogout
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /me/selection:
    put:
      operationId: putMeSelection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Selection'
      responses:
        '204':
          description: Selection saved.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /companies:
    get:
      operationId: listCompanies
      responses:
        '200':
          description: Companies the user can access.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /companies/{companyId}/projects:
    get:
      operationId: listProjects
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Projects in the company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/rfis:
    get:
      operationId: listRFIs
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-Company-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: RFIs in the project.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RFISummary'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    AuthStartRequest:
      type: object
      required: [device_id, code_challenge]
      properties:
        device_id:
          type: string
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
          description: Base64url without padding of the SHA-256 of a client-generated code_verifier.
    AuthStartResponse:
      type: object
      required: [authorize_url, state]
      properties:
        authorize_url:
          type: string
          format: uri
        state:
          type: string
    AuthExchangeRequest:
      type: object
      required: [code, device_id, code_verifier]
      properties:
        code:
          type: string
        device_id:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: The secret whose SHA-256 was sent as code_challenge to /auth/start.
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    User:
      type: object
      required: [id, procore_user_id, email, name, reauth_required]
      properties:
        id:
          type: string
          format: uuid
        procore_user_id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        reauth_required:
          type: boolean
        last_company_id:
          type: integer
          format: int64
        last_project_id:
          type: integer
          format: int64
    Selection:
      type: object
      required: [company_id, project_id]
      properties:
        company_id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Project:
      type: object
      required: [id, name, display_name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        display_name:
          type: string
    RFISummary:
      type: object
      required: [id, number, subject, status, assignees]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        subject:
          type: string
        status:
          type: string
        due_date:
          type: string
          format: date
        assignees:
          type: array
          items:
            type: string
