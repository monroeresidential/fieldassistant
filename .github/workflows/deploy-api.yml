name: deploy-api

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fa
          POSTGRES_PASSWORD: fa
          POSTGRES_DB: fieldassistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fa:fa@localhost:5432/fieldassistant_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Generate code
        run: make generate
      - name: Fail if generated code is stale
        run: test -z "$(git status --porcelain -- api/internal)" || (git status --porcelain -- api/internal; exit 1)
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Test
        working-directory: api
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fieldassistant-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/fieldassistant-api:sha-${{ steps.sha.outputs.short }}

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check droplet configured
        id: check
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::no droplet configured, skipping deploy"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        if: steps.check.outputs.configured == 'true'
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/fieldassistant/deploy
            docker compose pull api-dev
            docker compose up -d api-dev

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check droplet configured
        id: check
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::no droplet configured, skipping deploy"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        if: steps.check.outputs.configured == 'true'
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/fieldassistant/deploy
            docker compose pull api-prod
            docker compose up -d api-prod
